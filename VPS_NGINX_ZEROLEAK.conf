server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/zeroleakinfra.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zeroleakinfra.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    server_name zeroleakinfra.tech www.zeroleakinfra.tech 187.127.152.70;
    root /var/www/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Redirect legacy /dashboard to home
    location /dashboard {
        return 301 /;
    }

    location /privacy {
        try_files /privacy.html =404;
    }

    location /terms {
        try_files /terms.html =404;
    }

    location /deletion {
        try_files /deletion.html =404;
    }

    location /data-deletion {
        try_files /deletion.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

server {
    if ($host = www.zeroleakinfra.tech) {
        return 301 https://$host$request_uri;
    }
    if ($host = zeroleakinfra.tech) {
        return 301 https://$host$request_uri;
    }

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name zeroleakinfra.tech www.zeroleakinfra.tech 187.127.152.70;

    return 301 https://zeroleakinfra.tech$request_uri;
}
