<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ZeroLeak SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f8fafc',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <div class="flex items-center justify-center mb-6">
            <div class="w-10 h-10 rounded bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xl mr-2">Z</div>
            <span class="font-bold text-2xl tracking-tight text-slate-900">ZeroLeak.</span>
        </div>
        
        <h2 class="text-xl font-semibold text-center text-slate-800 mb-6">Create Your Account</h2>
        
        <form method="POST" action="/signup" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" name="username" placeholder="name@company.com" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mobile No.</label>
                <input type="tel" name="mobile_no" placeholder="+91 9876543210" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" required>
            </div>
            
            <button type="submit" class="w-full py-2 mt-4 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg transition-colors">
                Start Free Trial
            </button>
        </form>

        <div class="mt-6 flex items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="px-3 text-sm text-slate-400">or</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>
        
        <a href="/auth/google" class="mt-6 flex items-center justify-center w-full py-2 px-4 border border-slate-300 rounded-lg shadow-sm bg-white hover:bg-slate-50 transition-colors">
            <svg class="h-5 w-5 mr-2" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <span class="text-sm font-medium text-slate-700">Sign up with Google</span>
        </a>
        
        <div class="mt-6 text-center text-sm text-slate-500">
            Already have an account? <a href="/" class="text-brand-600 font-medium hover:underline">Log in</a>
        </div>
    </div>
</body>
</html>
